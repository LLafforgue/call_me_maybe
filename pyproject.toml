
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding on Qwen3-0.6B"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "llm_sdk"
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }